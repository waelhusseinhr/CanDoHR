# Pull request checks.
# Starts Postgres on the GitHub runner, rebuilds it from supabase/migrations
# with `supabase db reset`, then runs tests/schema/run_migrations_ci.sh.
# After that, runs the Step 2 package tests (money, dates, effective dating,
# and the tenant transaction) against that same local database.
# This does not connect to the CanDo cloud database.
# See docs/BUILD_STATUS.md.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start the local database
        run: supabase db start

      - name: Rebuild the database from migrations
        run: supabase db reset --local --no-seed

      # The runner logs in as postgres, which is not a superuser on the local
      # Supabase database. The smoke tests switch to cando_app with SET ROLE,
      # and that only works when postgres is a member of the role.
      - name: Let the smoke tests use the app role
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o json | python3 -c "import json,sys; print(json.load(sys.stdin)['DB_URL'])")"
          grant_sql="GRANT cando_app TO postgres; GRANT cando_sealer TO postgres;"
          if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$grant_sql"; then
            admin_url="$(python3 - "$DB_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit, urlunsplit
          parts = urlsplit(sys.argv[1])
          netloc = f"supabase_admin:postgres@{parts.hostname}:{parts.port}"
          print(urlunsplit((parts.scheme, netloc, parts.path, "", "")))
          PY
          )"
            psql "$admin_url" -v ON_ERROR_STOP=1 -c "$grant_sql"
          fi

      - name: Run schema smoke tests
        run: bash tests/schema/run_migrations_ci.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tenant test switches to step2_app with SET ROLE. postgres on the local
      # Supabase database is not a superuser, so it must be a member of that role.
      # Creating the role is retried as supabase_admin when postgres is not allowed to.
      - name: Let the tenant test use its own role
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o json | python3 -c "import json,sys; print(json.load(sys.stdin)['DB_URL'])")"
          admin_url="$(python3 - "$DB_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit, urlunsplit
          parts = urlsplit(sys.argv[1])
          netloc = f"supabase_admin:postgres@{parts.hostname}:{parts.port}"
          print(urlunsplit((parts.scheme, netloc, parts.path, "", "")))
          PY
          )"
          run_sql() {
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$1"; then
              psql "$admin_url" -v ON_ERROR_STOP=1 -c "$1"
            fi
          }
          if ! psql "$DB_URL" -tAc "select 1 from pg_roles where rolname = 'step2_app'" | grep -q 1; then
            run_sql "CREATE ROLE step2_app LOGIN PASSWORD 'step2-app-local'"
          fi
          run_sql "GRANT step2_app TO postgres"

      - name: Test shared foundations and tenant transactions
        run: |
          set -euo pipefail
          export DATABASE_URL="$(supabase status -o json | python3 -c "import json,sys; print(json.load(sys.stdin)['DB_URL'])")"
          pnpm --filter @candohr/shared test
          pnpm --filter @candohr/shared typecheck
          pnpm --filter @candohr/db test
          pnpm --filter @candohr/db typecheck
          pnpm --filter @candohr/audit test
          pnpm --filter @candohr/audit typecheck
          pnpm --filter @candohr/keys test
          pnpm --filter @candohr/keys typecheck
          pnpm --filter @candohr/access test
          pnpm --filter @candohr/access typecheck
          pnpm --filter @candohr/api typecheck
          pnpm --filter @candohr/identity typecheck
          pnpm --filter @candohr/jobs typecheck
          pnpm run platform-guards
