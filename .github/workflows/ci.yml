# Schema check for pull requests.
# Starts Postgres on the GitHub runner, rebuilds it from supabase/migrations
# with `supabase db reset`, then runs tests/schema/run_migrations_ci.sh.
# This does not connect to the CanDo cloud database.
# See docs/BUILD_STATUS.md (Step 1).

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start the local database
        run: supabase db start

      - name: Rebuild the database from migrations
        run: supabase db reset --local --no-seed

      # The runner logs in as postgres, which is not a superuser on the local
      # Supabase database. The smoke tests switch to cando_app with SET ROLE,
      # and that only works when postgres is a member of the role.
      - name: Let the smoke tests use the app role
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o json | python3 -c "import json,sys; print(json.load(sys.stdin)['DB_URL'])")"
          grant_sql="GRANT cando_app TO postgres; GRANT cando_sealer TO postgres;"
          if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -c "$grant_sql"; then
            admin_url="$(python3 - "$DB_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit, urlunsplit
          parts = urlsplit(sys.argv[1])
          netloc = f"supabase_admin:postgres@{parts.hostname}:{parts.port}"
          print(urlunsplit((parts.scheme, netloc, parts.path, "", "")))
          PY
          )"
            psql "$admin_url" -v ON_ERROR_STOP=1 -c "$grant_sql"
          fi

      - name: Run schema smoke tests
        run: bash tests/schema/run_migrations_ci.sh
