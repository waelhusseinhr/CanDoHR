# Schema check for pull requests.
# Starts Postgres on the GitHub runner, rebuilds it from supabase/migrations
# with `supabase db reset`, then runs tests/schema/run_migrations_ci.sh.
# This does not connect to the CanDo cloud database.
# See docs/BUILD_STATUS.md (Step 1).

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start the local database
        run: supabase db start

      - name: Rebuild the database from migrations
        run: supabase db reset --local --no-seed

      - name: Run schema smoke tests
        run: bash tests/schema/run_migrations_ci.sh
