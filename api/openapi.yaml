openapi: 3.1.0
info:
  title: CanDo HRIS API
  version: 1.0.0-draft
  description: |
    Contract for the CanDo HRIS backend. Rules that apply to every endpoint:
    * Every read accepts `asOf` (business date, default today). Auditors may also pass `knownAt` (system time).
    * Every write goes through a change set, either directly (`/v1/change-sets`) or created internally by a module endpoint.
    * POST requests accept an `Idempotency-Key` header.
    * Money is a decimal string with two decimals (e.g. "1234.50"); never a JSON number.
    * Sensitive fields are masked unless the caller has the `reveal` permission and passes `reveal=true` with a reason.
    * Errors use RFC 9457 problem details.
servers:
  - url: https://api.cando.example/v1
    description: Production (Canada)
security:
  - oauth2: []
tags:
  - name: Change sets
  - name: Organization
  - name: People
  - name: Payroll
  - name: Rules
  - name: Time and leave
  - name: Assistant
  - name: Audit
  - name: Webhooks
  - name: Recruitment
  - name: Competencies
  - name: Job evaluation
  - name: Surveys
  - name: Market pricing
  - name: Pay structures
  - name: Practices
  - name: Survey participation
  - name: Public wages

paths:
  /change-sets:
    post:
      tags: [Change sets]
      operationId: createChangeSet
      summary: Create a draft change set (the only write path)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeSetCreate' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSet' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Change sets]
      operationId: listChangeSets
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ChangeSetStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of change sets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ChangeSet' } }
                  nextCursor: { type: [string, 'null'] }
  /change-sets/{changeSetId}:
    get:
      tags: [Change sets]
      operationId: getChangeSet
      parameters: [ { $ref: '#/components/parameters/ChangeSetId' } ]
      responses:
        '200':
          description: Change set with operations, validation and approvals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSet' }
        '404': { $ref: '#/components/responses/Problem' }
  /change-sets/{changeSetId}/validate:
    post:
      tags: [Change sets]
      operationId: validateChangeSet
      summary: Run validation and the cascade in preview; returns errors, warnings and consequences
      parameters: [ { $ref: '#/components/parameters/ChangeSetId' } ]
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '409': { $ref: '#/components/responses/Problem' }
  /change-sets/{changeSetId}/submit:
    post:
      tags: [Change sets]
      operationId: submitChangeSet
      parameters: [ { $ref: '#/components/parameters/ChangeSetId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgedWarnings: { type: array, items: { type: string } }
                comment: { type: string }
      responses:
        '200':
          description: Submitted for approval (or committed if no approval is required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSet' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /change-sets/{changeSetId}/decision:
    post:
      tags: [Change sets]
      operationId: decideChangeSet
      summary: Approve or reject the current approval step
      parameters: [ { $ref: '#/components/parameters/ChangeSetId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { enum: [approve, reject] }
                comment: { type: string }
      responses:
        '200':
          description: Updated change set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSet' }
        '403': { $ref: '#/components/responses/Problem' }

  /org-chart:
    get:
      tags: [Organization]
      operationId: getOrgChart
      summary: Org chart nodes and edges as of a date (computed from records, never cached)
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - name: rootId
          in: query
          schema: { type: string, format: uuid }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 3 }
        - name: mode
          in: query
          schema: { enum: [position, person], default: position }
        - name: planId
          in: query
          description: Include the draft change sets of a plan (visible to plan members only)
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgChart' }
  /org-chart/moves:
    post:
      tags: [Organization]
      operationId: proposeOrgChartMove
      summary: Turn a drag-and-drop gesture into a draft change set with consequences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgChartMove' }
      responses:
        '201':
          description: Draft change set with validation preview
          content:
            application/json:
              schema:
                type: object
                required: [changeSet, validation]
                properties:
                  changeSet: { $ref: '#/components/schemas/ChangeSet' }
                  validation: { $ref: '#/components/schemas/ValidationResult' }
                  interpretations:
                    description: Present when the gesture is ambiguous; the client asks the user to choose one
                    type: array
                    items:
                      type: object
                      required: [code, label]
                      properties:
                        code: { enum: [move_position, transfer_to_vacancy, create_position, temporary_reporting] }
                        label: { type: string }
  /plans:
    post:
      tags: [Organization]
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, asOf]
              properties:
                name: { type: string }
                asOf: { type: string, format: date }
                members: { type: array, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
  /plans/{planId}/submit:
    post:
      tags: [Organization]
      operationId: submitPlan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: All draft change sets in the plan submitted as one batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
  /positions:
    get:
      tags: [Organization]
      operationId: listPositions
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - name: orgUnitId
          in: query
          schema: { type: string, format: uuid }
        - name: vacant
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Positions as of the date
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Position' } }
                  nextCursor: { type: [string, 'null'] }
  /positions/{positionId}:
    get:
      tags: [Organization]
      operationId: getPosition
      parameters:
        - name: positionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Position as of the date, with holders and history links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
  /people:
    get:
      tags: [People]
      operationId: searchPeople
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: People within the caller's scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PersonSummary' } }
                  nextCursor: { type: [string, 'null'] }
  /employments/{employmentId}:
    get:
      tags: [People]
      operationId: getEmployment
      parameters:
        - $ref: '#/components/parameters/EmploymentId'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/KnownAt'
      responses:
        '200':
          description: Employment with assignments, rates and derived values as of the date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employment' }
  /employments/{employmentId}/history:
    get:
      tags: [People]
      operationId: getEmploymentHistory
      parameters: [ { $ref: '#/components/parameters/EmploymentId' } ]
      responses:
        '200':
          description: Every version with its change set, actor and reason
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryEntry' }

  /payroll/runs:
    post:
      tags: [Payroll]
      operationId: createPayRun
      summary: Create a pay run for any population, work period and pay date
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRunCreate' }
      responses:
        '201':
          description: Run created in draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayRun' }
        '422':
          description: For example NO_RULE_EDITION when no statutory edition covers the pay date
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /payroll/runs/{payRunId}:
    get:
      tags: [Payroll]
      operationId: getPayRun
      parameters: [ { $ref: '#/components/parameters/PayRunId' } ]
      responses:
        '200':
          description: Run with status, control totals and exceptions count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayRun' }
  /payroll/runs/{payRunId}/actions/{action}:
    post:
      tags: [Payroll]
      operationId: payRunAction
      summary: Advance a run (lock inputs, calculate, mark reviewed, approve, finalize, cancel)
      parameters:
        - $ref: '#/components/parameters/PayRunId'
        - name: action
          in: path
          required: true
          schema: { enum: [lock_inputs, calculate, mark_reviewed, approve, finalize, cancel] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        '202':
          description: Accepted; long actions run as jobs and report progress on the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayRun' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: >-
            For example SUBJECT_IN_OPEN_RUN on lock_inputs when a person in the population is already
            leased by another open run (blockingRunId names it), or VERSION_CONFLICT on a stale action
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: For example UNRESOLVED_INTERACTION when an agreement leaves a premium combination undefined (lock_inputs)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /payroll/runs/{payRunId}/results:
    get:
      tags: [Payroll]
      operationId: listPayResults
      parameters:
        - $ref: '#/components/parameters/PayRunId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Results per employee
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PayResult' } }
                  nextCursor: { type: [string, 'null'] }
  /payroll/results/{payResultId}/explanation:
    get:
      tags: [Payroll]
      operationId: explainPayResult
      summary: Calculation trace and a plain-language explanation of every amount
      parameters:
        - name: payResultId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lang
          in: query
          required: true
          description: One of the organization's data languages (BCP 47 code, for example en, fr, iu). No language is assumed (docs/22 §4).
          schema: { type: string, pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayExplanation' }
  /payroll/simulations:
    post:
      tags: [Payroll]
      operationId: simulatePay
      summary: What-if calculation for one employee; never stored in YTD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employmentId, payDate]
              properties:
                employmentId: { type: string, format: uuid }
                payDate: { type: string, format: date }
                workPeriod: { $ref: '#/components/schemas/DateRange' }
                applyChangeSetId: { type: string, format: uuid, description: Draft change set applied in memory }
                overrides:
                  type: object
                  description: Temporary inputs such as a different TD1 claim or RRSP amount
                  additionalProperties: true
      responses:
        '200':
          description: Simulated result and comparison with the current expected pay
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulated: { $ref: '#/components/schemas/PayResult' }
                  baseline: { $ref: '#/components/schemas/PayResult' }
                  netDifference: { $ref: '#/components/schemas/Money' }
  /payroll/retro-requests:
    get:
      tags: [Payroll]
      operationId: listRetroRequests
      parameters:
        - name: status
          in: query
          schema: { enum: [queued, calculated, approved, paid, no_difference, cancelled] }
        - name: changeSetId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Retro requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RetroRequest' }

  /rules/editions:
    get:
      tags: [Rules]
      operationId: listRuleEditions
      parameters:
        - name: family
          in: query
          schema: { enum: [statutory, employer_taxes, employment_standards, quebec_tax] }
      responses:
        '200':
          description: Editions with status and effective dates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RuleEdition' }
  /rules/resolve:
    get:
      tags: [Rules]
      operationId: resolveRules
      summary: Effective rules for an assignment on a date (statute, agreement, policy; greater right applied)
      parameters:
        - name: assignmentId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Resolved rules with their sources
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agreements/{agreementId}/versions:
    post:
      tags: [Rules]
      operationId: createAgreementVersion
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: One version object as defined in rules/agreements/agreement.schema.json ($defs.version)
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Draft version created; rules start unverified
  /agreements/{agreementId}/versions/{version}/activate:
    post:
      tags: [Rules]
      operationId: activateAgreementVersion
      summary: Creates an agreement.activate_version change set (two-person approval; retro if retro_from is set)
      parameters:
        - name: agreementId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201':
          description: Change set created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSet' }
        '422':
          description: Unverified rules remain
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /timesheets/{timesheetId}/submit:
    post:
      tags: [Time and leave]
      operationId: submitTimesheet
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Submitted }
  /leave/balances:
    get:
      tags: [Time and leave]
      operationId: getLeaveBalances
      summary: Balances as of any date, including scheduled future accruals
      parameters:
        - name: employmentId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Balances by leave type
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [leaveType, hours]
                  properties:
                    leaveType: { type: string }
                    hours: { type: string }
                    amount: { $ref: '#/components/schemas/Money' }
                    asOf: { type: string, format: date }
  /leave/requests:
    post:
      tags: [Time and leave]
      operationId: createLeaveRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employmentId, leaveType, start, end]
              properties:
                employmentId: { type: string, format: uuid }
                leaveType: { type: string }
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
                comment: { type: string }
      responses:
        '201': { description: Request created and routed for approval }

  /assistant/messages:
    post:
      tags: [Assistant]
      operationId: askAssistant
      summary: Ask the assistant; it acts as the caller and can only propose draft change sets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                conversationId: { type: string, format: uuid }
                message: { type: string, maxLength: 4000 }
                context:
                  type: object
                  properties:
                    screen: { type: string }
                    recordType: { type: string }
                    recordId: { type: string }
      responses:
        '200':
          description: Answer with citations and optional draft change set
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer: { type: string }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { enum: [record, rule, document, trace, report] }
                        ref: { type: string }
                        label: { type: string }
                  draftChangeSetId: { type: [string, 'null'], format: uuid }
        '403':
          description: Assistant disabled for this tenant (residency or settings)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /audit/entries/{auditId}/proof:
    get:
      tags: [Audit]
      operationId: getAuditInclusionProof
      summary: Inclusion proof for one audit row, checkable offline with the published public key
      parameters:
        - name: auditId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Proof (see reference/audit_merkle_reference.py verify_inclusion)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditProof' }
        '409':
          description: AUDIT_NOT_SEALED when the row is not yet in a batch (sealing runs hourly)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /audit/verifications:
    post:
      tags: [Audit]
      operationId: runAuditVerification
      summary: Verify the tenant's audit chain (all batches or a range) against the anchored copies
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fromBatchNo: { type: integer }
                toBatchNo: { type: integer }
                customerDigest:
                  type: object
                  description: A digest the customer kept, to confirm it is still in the chain
                  properties:
                    batchNo: { type: integer }
                    batchHash: { type: string }
      responses:
        '200':
          description: Result per batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  batchesChecked: { type: integer }
                  failures:
                    type: array
                    items:
                      type: object
                      properties:
                        batchNo: { type: integer }
                        check: { enum: [root, chain, signature, anchor, gap] }
                        auditIds: { type: array, items: { type: integer } }
  /webhooks/subscriptions:
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventTypes]
              properties:
                url: { type: string, format: uri }
                eventTypes: { type: array, items: { type: string } }
      responses:
        '201':
          description: Subscription created; the signing secret is shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId: { type: string, format: uuid }
                  secret: { type: string }
  /workflow-routes:
    get:
      tags: [Recruitment]
      operationId: listWorkflowRoutes
      parameters:
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200': { description: Routes the organization has copied and edited }
    post:
      tags: [Recruitment]
      operationId: createWorkflowRoute
      responses:
        '201': { description: Route created through a change set }
  /workflow-routes/{routeId}/steps:
    post:
      tags: [Recruitment]
      operationId: addWorkflowRouteStep
      parameters:
        - name: routeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Step added }
  /cautions/acknowledgements:
    post:
      tags: [Recruitment]
      operationId: acknowledgeCaution
      responses:
        '201': { description: The text shown and the person who went past the caution }
  /requisitions:
    post:
      tags: [Recruitment]
      operationId: createRequisition
      responses:
        '201': { description: Requisition drafted from the position, with funding lines }
  /requisitions/{requisitionId}/submit:
    post:
      tags: [Recruitment]
      operationId: submitRequisition
      parameters:
        - { name: requisitionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Submitted on the organization's route }
  /requisitions/{requisitionId}/approve:
    post:
      tags: [Recruitment]
      operationId: approveRequisition
      parameters:
        - { name: requisitionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Approval recorded }
  /posting-exemption-rules:
    get:
      tags: [Recruitment]
      operationId: listPostingExemptionRules
      responses:
        '200': { description: The organization's posting exemptions }
  /postings:
    post:
      tags: [Recruitment]
      operationId: createPosting
      responses:
        '201': { description: Posting checked against the location's pay-transparency rule }
  /postings/{postingId}/publish:
    post:
      tags: [Recruitment]
      operationId: publishPosting
      parameters:
        - { name: postingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Published on an approved requisition }
  /candidates:
    post:
      tags: [Recruitment]
      operationId: createCandidate
      responses:
        '201': { description: Candidate record }
  /apply:
    post:
      tags: [Recruitment]
      operationId: applyWithoutAccount
      security: []
      responses:
        '201': { description: Application without a sign-in account }
  /applications/{applicationId}/decide:
    post:
      tags: [Recruitment]
      operationId: decideApplication
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: A person records the decision }
  /interviews/{interviewId}/scores:
    post:
      tags: [Recruitment]
      operationId: submitInterviewScore
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Score locked once submitted }
  /message-templates:
    get:
      tags: [Recruitment]
      operationId: listMessageTemplates
      responses:
        '200': { description: The organization's message templates }
  /message-batches:
    post:
      tags: [Recruitment]
      operationId: sendMessageBatch
      responses:
        '201': { description: Batch sent with a reason }
  /offers:
    post:
      tags: [Recruitment]
      operationId: createOffer
      responses:
        '201': { description: Offer drafted inside or outside the range }
  /offers/{offerId}/submit:
    post:
      tags: [Recruitment]
      operationId: submitOffer
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Submitted on the organization's route }
  /offers/{offerId}/approve:
    post:
      tags: [Recruitment]
      operationId: approveOffer
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Approval recorded }
  /offers/{offerId}/send:
    post:
      tags: [Recruitment]
      operationId: sendOffer
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Sent once approved }
  /offers/{offerId}/accept:
    post:
      tags: [Recruitment]
      operationId: acceptOffer
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Candidate accepted }
  /offers/{offerId}/sign-contract:
    post:
      tags: [Recruitment]
      operationId: signOfferContract
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Contract signed on an accepted offer }
  /offers/{offerId}/conditions:
    post:
      tags: [Recruitment]
      operationId: startOfferCondition
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Conditional check after the offer is sent, with consent }
  /onboarding-plans:
    get:
      tags: [Recruitment]
      operationId: listOnboardingPlans
      responses:
        '200': { description: Plans the organization edited from the starters }
  /employments/{employmentId}/onboarding/generate:
    post:
      tags: [Recruitment]
      operationId: generateOnboardingTasks
      parameters:
        - { name: employmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Tasks from every plan that applies }
  /onboarding-tasks/{taskId}/complete:
    post:
      tags: [Recruitment]
      operationId: completeOnboardingTask
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Task completed by a named person }
  /employments/{employmentId}/supporters:
    post:
      tags: [Recruitment]
      operationId: addOnboardingSupporter
      parameters:
        - { name: employmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Buddy, mentor, or trainer }
  /employments/{employmentId}/probation/extensions:
    post:
      tags: [Recruitment]
      operationId: proposeProbationExtension
      parameters:
        - { name: employmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Extension proposed with a reason }
  /employments/{employmentId}/open-matters:
    get:
      tags: [Recruitment]
      operationId: listOpenMatters
      parameters:
        - { name: employmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: HR sees the matters; a respondent sees only that HR must review }
  /status-conversions:
    post:
      tags: [Recruitment]
      operationId: requestStatusConversion
      responses:
        '201': { description: Conversion requested by a manager, a threshold, or an agreement }

  # ------------------------------------------------------------------ Competencies (§4)
  /competency-frameworks:
    get:
      tags: [Competencies]
      operationId: listCompetencyFrameworks
      summary: Frameworks with their versions and statuses
      responses:
        '200':
          description: Frameworks
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CompetencyFramework' } }
  /competency-frameworks/{frameworkCode}/versions/{label}:
    get:
      tags: [Competencies]
      operationId: getCompetencyFrameworkVersion
      summary: One version with its scale, competencies and indicators
      parameters: [ { $ref: '#/components/parameters/FrameworkCode' }, { $ref: '#/components/parameters/Label' }, { $ref: '#/components/parameters/Lang' } ]
      responses:
        '200':
          description: Version
          content: { application/json: { schema: { $ref: '#/components/schemas/CompetencyFrameworkVersion' } } }
        '404': { description: Unknown framework or version }
  /competency-frameworks/{frameworkCode}/versions/{label}/publish:
    post:
      tags: [Competencies]
      operationId: publishCompetencyFrameworkVersion
      summary: Publish a draft version; refused while any competency's indicators are proposed
      parameters: [ { $ref: '#/components/parameters/FrameworkCode' }, { $ref: '#/components/parameters/Label' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: Published; proposals to move targets from the previous version are returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { $ref: '#/components/schemas/CompetencyFrameworkVersion' }
                  targetMoveChangeSetId: { type: [string, 'null'], format: uuid }
        '409': { $ref: '#/components/responses/Refused' }
  /{targetType}/{targetId}/competency-targets:
    get:
      tags: [Competencies]
      operationId: listCompetencyTargets
      summary: Effective targets of a job or position on a date, with where each comes from
      parameters:
        - { name: targetType, in: path, required: true, schema: { type: string, enum: [jobs, positions] } }
        - { name: targetId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Targets
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CompetencyTarget' } }
  /jobs/{jobId}/competency-targets/propose:
    post:
      tags: [Competencies]
      operationId: proposeCompetencyTargets
      summary: Propose targets from the job's career level defaults (§4.3); nothing is active until the change set is approved
      parameters: [ { $ref: '#/components/parameters/JobId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frameworkCode, effectiveFrom]
              properties:
                frameworkCode: { type: string, examples: [UCM] }
                effectiveFrom: { type: string, format: date }
      responses:
        '201':
          description: Proposed targets in a draft change set
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeSetId: { type: string, format: uuid }
                  proposed: { type: array, items: { $ref: '#/components/schemas/CompetencyTarget' } }
  /people/{personId}/competency-assessments:
    post:
      tags: [Competencies]
      operationId: createCompetencyAssessment
      summary: Record an assessment (draft or final); a correction names the assessment it supersedes
      parameters: [ { name: personId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompetencyAssessmentInput' } } }
      responses:
        '201':
          description: Assessment
          content: { application/json: { schema: { $ref: '#/components/schemas/CompetencyAssessment' } } }
        '409': { $ref: '#/components/responses/Refused' }
  /assignments/{assignmentId}/competency-gaps:
    get:
      tags: [Competencies]
      operationId: getCompetencyGaps
      summary: Gaps against the position's targets on a date (§4.6)
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/AsOf'
        - { name: includeSelf, in: query, description: Count self-assessments as well, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Gaps
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CompetencyGap' } }

  # ------------------------------------------------------------------ Job evaluation (§5)
  /je-plans:
    get:
      tags: [Job evaluation]
      operationId: listJobEvaluationPlans
      summary: Plans with versions, factors, degrees and grade bands
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/JobEvaluationPlan' } }
  /je-plans/{planCode}/versions/{label}/publish:
    post:
      tags: [Job evaluation]
      operationId: publishJobEvaluationPlanVersion
      summary: Publish a draft plan version after the validation in §5.1
      parameters: [ { $ref: '#/components/parameters/PlanCode' }, { $ref: '#/components/parameters/Label' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                genderNeutralReview:
                  type: object
                  required: [reviewedOn, reviewedBy]
                  properties:
                    reviewedOn: { type: string, format: date }
                    reviewedBy: { type: array, items: { type: string } }
                    findings: { type: string }
      responses:
        '200': { description: Published }
        '409': { $ref: '#/components/responses/Refused' }
  /job-evaluations:
    post:
      tags: [Job evaluation]
      operationId: createJobEvaluation
      summary: Start an evaluation of a job (or a position) under a published plan version
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, planCode, planVersion, effectiveFrom]
              properties:
                jobId: { type: string, format: uuid }
                positionId: { type: string, format: uuid }
                planCode: { type: string, examples: [CANDO-PF] }
                planVersion: { type: string, examples: ['2026.10'] }
                effectiveFrom: { type: string, format: date }
                supersedesEvaluationId: { type: string, format: uuid }
                jobDescriptionRef: { type: object, additionalProperties: true }
                evaluatorIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Draft evaluation with the evidence and suggested degree ranges per factor
          content: { application/json: { schema: { $ref: '#/components/schemas/JobEvaluation' } } }
        '409': { $ref: '#/components/responses/Refused' }
  /job-evaluations/{evaluationId}:
    get:
      tags: [Job evaluation]
      operationId: getJobEvaluation
      summary: An evaluation with ratings, evidence and suggestions
      parameters: [ { $ref: '#/components/parameters/EvaluationId' } ]
      responses:
        '200':
          description: Evaluation
          content: { application/json: { schema: { $ref: '#/components/schemas/JobEvaluation' } } }
  /job-evaluations/{evaluationId}/ratings/{factorCode}:
    put:
      tags: [Job evaluation]
      operationId: rateJobEvaluationFactor
      summary: Set the degree for one factor, with a rationale (and a reason when outside the suggestion)
      parameters: [ { $ref: '#/components/parameters/EvaluationId' }, { name: factorCode, in: path, required: true, schema: { type: string, examples: [K1] } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [degree, rationale]
              properties:
                degree: { type: integer, minimum: 1 }
                rationale: { type: string, minLength: 1 }
                outsideReason: { type: string }
                evidence: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Rating with its points
          content: { application/json: { schema: { $ref: '#/components/schemas/FactorRating' } } }
        '409': { $ref: '#/components/responses/Refused' }
  /job-evaluations/{evaluationId}/submit:
    post:
      tags: [Job evaluation]
      operationId: submitJobEvaluation
      summary: Send a draft to committee review
      parameters: [ { $ref: '#/components/parameters/EvaluationId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: In review }
        '409': { $ref: '#/components/responses/Refused' }
  /job-evaluations/{evaluationId}/approve:
    post:
      tags: [Job evaluation]
      operationId: approveJobEvaluation
      summary: Approve; points and grade are computed and a grade change for the job is proposed as a change set
      parameters: [ { $ref: '#/components/parameters/EvaluationId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                committee:
                  type: array
                  items:
                    type: object
                    required: [personId, role]
                    properties:
                      personId: { type: string, format: uuid }
                      role: { type: string, enum: [employer, employee, chair, adviser] }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluation: { $ref: '#/components/schemas/JobEvaluation' }
                  gradeChangeSetId: { type: [string, 'null'], format: uuid }
        '409': { $ref: '#/components/responses/Refused' }

  # ------------------------------------------------------------------ Surveys (§6)
  /surveys:
    get:
      tags: [Surveys]
      operationId: listSurveys
      summary: The survey library with licences, editions and whether the caller holds each survey's role
      responses:
        '200':
          description: Surveys
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Survey' } }
    post:
      tags: [Surveys]
      operationId: createSurvey
      summary: Add a survey; its job catalogue scheme is created with purpose salary_survey
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SurveyInput' } } }
      responses:
        '201':
          description: Survey
          content: { application/json: { schema: { $ref: '#/components/schemas/Survey' } } }
  /surveys/{surveyCode}/editions:
    post:
      tags: [Surveys]
      operationId: createSurveyEdition
      summary: Start loading an edition
      parameters: [ { $ref: '#/components/parameters/SurveyCode' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SurveyEditionInput' } } }
      responses:
        '201':
          description: Edition in status loading
          content: { application/json: { schema: { $ref: '#/components/schemas/SurveyEdition' } } }
  /survey-editions/{editionId}/imports:
    post:
      tags: [Surveys]
      operationId: importSurveyFile
      summary: Upload one file with an import profile; dryRun validates without loading
      parameters: [ { $ref: '#/components/parameters/EditionId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, profile, locale]
              properties:
                file: { type: string, contentEncoding: binary }
                profile: { type: string, enum: [wide_stats, long_stats, job_catalogue, cut_dictionary, practice_prevalence] }
                columnMap: { type: string, description: JSON object overriding the proposed column mapping }
                locale: { type: string, description: Locale of the file's numbers and dates (BCP 47, for example en-CA or fr-CA), examples: [en-CA, fr-CA] }
                dryRun: { type: boolean, default: true }
      responses:
        '200':
          description: Import report
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } }
  /survey-editions/{editionId}/publish:
    post:
      tags: [Surveys]
      operationId: publishSurveyEdition
      summary: Publish a loaded edition; it becomes read-only and runs on the previous edition are marked stale
      parameters: [ { $ref: '#/components/parameters/EditionId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: Published }
        '409': { $ref: '#/components/responses/Refused' }
  /survey-editions/{editionId}/market-data:
    get:
      tags: [Surveys]
      operationId: listMarketData
      summary: Published statistics for survey jobs (needs the survey's role); masked values are null
      parameters:
        - $ref: '#/components/parameters/EditionId'
        - { name: jobCode, in: query, schema: { type: string } }
        - { name: cut, in: query, schema: { type: string } }
        - { name: element, in: query, schema: { $ref: '#/components/schemas/Element' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MarketDataRow' } }
        '403': { description: 'SURVEY_ROLE_REQUIRED' }
  /benchmark-coverage:
    get:
      tags: [Surveys]
      operationId: getBenchmarkCoverage
      summary: Share of benchmark jobs, positions and incumbents matched, by survey, family and level (§6.3)
      parameters: [ { $ref: '#/components/parameters/AsOf' }, { name: surveyCode, in: query, schema: { type: string } } ]
      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    surveyCode: { type: string }
                    family: { type: string }
                    level: { type: string }
                    jobs: { type: integer }
                    jobsMatched: { type: integer }
                    positionsMatched: { type: integer }
                    incumbentsMatched: { type: integer }

  # ------------------------------------------------------------------ Market pricing (§7)
  /market-definitions:
    get:
      tags: [Market pricing]
      operationId: listMarketDefinitions
      summary: Market definitions with their sources
      responses:
        '200':
          description: Definitions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MarketDefinition' } }
    post:
      tags: [Market pricing]
      operationId: createMarketDefinition
      summary: Create a market definition
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketDefinition' } } }
      responses:
        '201': { description: Created }
  /market-pricing-runs:
    post:
      tags: [Market pricing]
      operationId: createMarketPricingRun
      summary: Price the definition's jobs at a common date; runs in the background
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definitionCode, asOf]
              properties:
                definitionCode: { type: string }
                asOf: { type: string, format: date }
                jobIds: { type: array, items: { type: string, format: uuid }, description: Defaults to every job the definition applies to }
      responses:
        '202':
          description: Run created in status draft; poll the run
          content: { application/json: { schema: { $ref: '#/components/schemas/PricingRun' } } }
  /market-pricing-runs/{runId}:
    get:
      tags: [Market pricing]
      operationId: getMarketPricingRun
      summary: Run with per-job results and lineage
      parameters: [ { $ref: '#/components/parameters/RunId' } ]
      responses:
        '200':
          description: Run
          content: { application/json: { schema: { $ref: '#/components/schemas/PricingRun' } } }
  /market-pricing-runs/{runId}/approve:
    post:
      tags: [Market pricing]
      operationId: approveMarketPricingRun
      summary: Approve a run; the previous approved run of the definition is superseded
      parameters: [ { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: Approved }
        '409': { $ref: '#/components/responses/Refused' }

  # ------------------------------------------------------------------ Pay structures (§7.6 to §7.9)
  /pay-structures/{structureCode}/versions:
    post:
      tags: [Pay structures]
      operationId: draftPayStructureVersion
      summary: Draft a version from an approved pricing run and a plan version (market line, grades, ranges), or from market slotting
      parameters: [ { name: structureCode, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, validFrom, method]
              properties:
                label: { type: string }
                validFrom: { type: string, format: date }
                validTo: { type: string, format: date }
                method: { type: string, enum: [market_line, market_slotting, copy_previous] }
                pricingRunId: { type: string, format: uuid }
                planCode: { type: string }
                planVersion: { type: string }
                spreads: { type: object, additionalProperties: { $ref: '#/components/schemas/Decimal' }, description: Spread percentage by grade }
                rounding: { $ref: '#/components/schemas/Decimal' }
                outlierPct: { $ref: '#/components/schemas/Decimal' }
                excludeJobs:
                  type: array
                  items: { type: object, required: [jobId, reason], properties: { jobId: { type: string, format: uuid }, reason: { type: string } } }
      responses:
        '201':
          description: Draft version with the line, residuals, grades and modelling
          content: { application/json: { schema: { $ref: '#/components/schemas/PayStructureVersion' } } }
  /pay-structure-versions/{versionId}/approve:
    post:
      tags: [Pay structures]
      operationId: approvePayStructureVersion
      summary: Approve; salary ranges are written, compa-ratios recomputed and open requisitions flagged
      parameters: [ { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: Approved }
        '409': { $ref: '#/components/responses/Refused' }
  /assignments/{assignmentId}/pay-position:
    get:
      tags: [Pay structures]
      operationId: getPayPosition
      summary: Position in range and against the market for an assignment
      parameters: [ { $ref: '#/components/parameters/AssignmentId' }, { $ref: '#/components/parameters/AsOf' } ]
      responses:
        '200':
          description: Pay position
          content:
            application/json:
              schema:
                type: object
                properties:
                  grade: { type: string }
                  annualRate: { $ref: '#/components/schemas/Decimal' }
                  minimum: { $ref: '#/components/schemas/Decimal' }
                  midpoint: { $ref: '#/components/schemas/Decimal' }
                  maximum: { $ref: '#/components/schemas/Decimal' }
                  compaRatio: { $ref: '#/components/schemas/Decimal' }
                  penetration: { $ref: '#/components/schemas/Decimal' }
                  quartile: { type: string, enum: [below_minimum, Q1, Q2, Q3, Q4, above_maximum] }
                  marketRatio: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }

  # ------------------------------------------------------------------ Practices (§8)
  /practice-scorecard:
    get:
      tags: [Practices]
      operationId: getPracticeScorecard
      summary: Own values against market practice for a population (benefit class or agreement)
      parameters:
        - { name: population, in: query, required: true, schema: { type: string, examples: [NONUNION] } }
        - { name: editionId, in: query, schema: { type: string, format: uuid } }
        - { name: cut, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Scorecard
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PracticeComparison' } }

  # ------------------------------------------------------------------ Survey participation (§10)
  /survey-submissions:
    post:
      tags: [Survey participation]
      operationId: prepareSurveySubmission
      summary: Prepare a submission for a survey's next edition from effective matches, pay and practice values
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surveyCode, editionLabel, asOf]
              properties:
                surveyCode: { type: string }
                editionLabel: { type: string }
                asOf: { type: string, format: date }
                includedFields: { type: array, items: { type: string, examples: [hire_year, bargaining_unit] } }
                includeVacant: { type: boolean, default: false }
                privacyApproval: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Draft submission
          content: { application/json: { schema: { $ref: '#/components/schemas/SurveySubmission' } } }
        '409': { $ref: '#/components/responses/Refused' }
  /survey-submissions/{submissionId}:
    get:
      tags: [Survey participation]
      operationId: getSurveySubmission
      summary: Submission with its rows (pseudonyms only)
      parameters: [ { $ref: '#/components/parameters/SubmissionId' } ]
      responses:
        '200':
          description: Submission
          content: { application/json: { schema: { $ref: '#/components/schemas/SurveySubmission' } } }
  /survey-submissions/{submissionId}/approve:
    post:
      tags: [Survey participation]
      operationId: approveSurveySubmission
      summary: Approve; rows are frozen
      parameters: [ { $ref: '#/components/parameters/SubmissionId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: Approved }
        '409': { $ref: '#/components/responses/Refused' }
  /survey-submissions/{submissionId}/export:
    post:
      tags: [Survey participation]
      operationId: exportSurveySubmission
      summary: Produce the file in the survey's requested layout and record its hash
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: xlsx } }
      responses:
        '200':
          description: File
          headers:
            X-Content-SHA256: { schema: { type: string } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, contentEncoding: binary } }
            text/csv: { schema: { type: string } }

  # ------------------------------------------------------------------ Public wages (§6.5)
  /public-wages:
    get:
      tags: [Public wages]
      operationId: listPublicWages
      summary: Public wage rows for a NOC code in the latest published edition (or a given one)
      parameters:
        - { name: noc, in: query, required: true, schema: { type: string, pattern: '^[0-9]{5}$' } }
        - { name: geo, in: query, description: Statistics Canada geography code, schema: { type: string, examples: [CA, '59', '5920'] } }
        - { name: editionId, in: query, schema: { type: string, examples: [JOBBANK-2025-11] } }
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicWage' } }


components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.cando.example/oauth2/authorize
          tokenUrl: https://auth.cando.example/oauth2/token
          scopes:
            core.read: Read Core HR
            core.write: Create change sets in Core HR
            payroll.read: Read payroll
            payroll.process: Create and calculate pay runs
            payroll.approve: Approve and finalize pay runs
            rules.admin: Manage rule editions and agreements
            assistant.use: Use the assistant
        clientCredentials:
          tokenUrl: https://auth.cando.example/oauth2/token
          scopes:
            core.read: Read Core HR
            core.write: Create change sets in Core HR
            payroll.read: Read payroll

  parameters:
    AsOf:
      name: asOf
      in: query
      description: Business date for the read (default today in the legal entity's time zone)
      schema: { type: string, format: date }
    KnownAt:
      name: knownAt
      in: query
      description: System time for audit reads (what CanDo knew at that moment)
      schema: { type: string, format: date-time }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 128 }
    ChangeSetId:
      name: changeSetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmploymentId:
      name: employmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PayRunId:
      name: payRunId
      in: path
      required: true
      schema: { type: string, format: uuid }

    Lang: { name: lang, in: query, required: true, description: "One of the organization's data languages (BCP 47); no language is assumed (docs/22 §4)", schema: { type: string, pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$' } }
    FrameworkCode: { name: frameworkCode, in: path, required: true, schema: { type: string, examples: [UCM] } }
    PlanCode: { name: planCode, in: path, required: true, schema: { type: string, examples: [CANDO-PF] } }
    Label: { name: label, in: path, required: true, schema: { type: string } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    EvaluationId: { name: evaluationId, in: path, required: true, schema: { type: string, format: uuid } }
    SurveyCode: { name: surveyCode, in: path, required: true, schema: { type: string } }
    EditionId: { name: editionId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    SubmissionId: { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }


  responses:
    Refused:
      description: Refused by a rule; the problem detail carries the code (for example FRAMEWORK_INDICATORS_PROPOSED, JE_PLAN_GROUP_MISSING, EVALUATION_INCOMPLETE, OUTSIDE_SUGGESTION_NEEDS_REASON, EDITION_IMMUTABLE)
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, code]
            properties:
              type: { type: string }
              title: { type: string }
              code: { type: string }
              params: { type: object, additionalProperties: true }

    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      examples: ['2500.00']
    DateRange:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date, description: Inclusive }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, examples: [NO_RULE_EDITION, VERSION_CONFLICT, SELF_APPROVAL_BLOCKED, OVER_FTE, SUBJECT_IN_OPEN_RUN, RULE_HASH_MISMATCH, RULE_EDITION_IMMUTABLE, AGREEMENT_VERSION_IMMUTABLE, UNRESOLVED_INTERACTION] }
        blockingRunId: { type: string, format: uuid, description: Set on SUBJECT_IN_OPEN_RUN }
        current: { description: Current state on VERSION_CONFLICT, type: object, additionalProperties: true }
    ChangeSetStatus:
      enum: [draft, validated, pending_approval, approved, scheduled, committed, rejected, cancelled]
    Operation:
      type: object
      required: [op]
      properties:
        op:
          type: string
          examples: [assignment.update, position.update, org_unit.move, employment.hire, compensation.set_rate, agreement.activate_version, time.correct]
        targetId: { type: string, format: uuid }
        set:
          type: object
          additionalProperties: true
        addedByCascade: { type: boolean, readOnly: true }
    ChangeSetCreate:
      type: object
      required: [kind, reasonCode, effectiveDate, operations]
      properties:
        kind: { type: string }
        reasonCode: { type: string }
        isCorrection: { type: boolean, default: false }
        effectiveDate: { type: string, format: date }
        planId: { type: string, format: uuid }
        operations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Operation' }
        baseVersions:
          type: object
          additionalProperties: { type: integer }
        comment: { type: string }
    ChangeSet:
      allOf:
        - $ref: '#/components/schemas/ChangeSetCreate'
        - type: object
          required: [changeSetId, number, status, source, requestedBy, requestedAt]
          properties:
            changeSetId: { type: string, format: uuid }
            number: { type: integer }
            status: { $ref: '#/components/schemas/ChangeSetStatus' }
            source: { enum: [ui_form, org_chart, mass_change, import, api, workflow, assistant_draft, system] }
            requestedBy: { type: string, format: uuid }
            requestedAt: { type: string, format: date-time }
            committedAt: { type: [string, 'null'], format: date-time }
            validation: { $ref: '#/components/schemas/ValidationResult' }
            retroEstimate: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
            approvals:
              type: array
              items:
                type: object
                properties:
                  step: { type: integer }
                  assignee: { type: string }
                  status: { enum: [open, approved, rejected, delegated, expired] }
                  decidedAt: { type: [string, 'null'], format: date-time }
    ValidationResult:
      type: object
      required: [errors, warnings, consequences]
      properties:
        errors:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        consequences:
          type: array
          items:
            type: object
            required: [kind, description]
            properties:
              kind:
                enum: [org_unit, cost_centre, location_province, tax_province, holiday_calendar, agreement, approver, benefits_class, budget, retro, conflict_future_change, task]
              description: { type: string }
              from: {}
              to: {}
              addedOperation: { $ref: '#/components/schemas/Operation' }
    Finding:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        operationIndex: { type: integer }
        field: { type: string }
    OrgChartMove:
      type: object
      required: [subject, target, effectiveDate]
      properties:
        subject:
          type: object
          required: [type, id]
          properties:
            type: { enum: [position, person_assignment, org_unit, multiple] }
            id: { type: string, format: uuid }
            ids: { type: array, items: { type: string, format: uuid } }
        target:
          type: object
          required: [type, id]
          properties:
            type: { enum: [position, vacant_position, org_unit, person_assignment] }
            id: { type: string, format: uuid }
        interpretation:
          description: Chosen by the user when the server returned several interpretations
          enum: [move_position, transfer_to_vacancy, create_position, temporary_reporting]
        effectiveDate: { type: string, format: date }
        reasonCode: { type: string }
        planId: { type: string, format: uuid }
    OrgChart:
      type: object
      required: [asOf, nodes, edges]
      properties:
        asOf: { type: string, format: date }
        nodes:
          type: array
          items:
            type: object
            required: [id, kind, title]
            properties:
              id: { type: string, format: uuid }
              kind: { enum: [position, person, org_unit] }
              title: { type: string }
              orgUnitId: { type: string, format: uuid }
              holders:
                type: array
                items:
                  type: object
                  properties:
                    assignmentId: { type: string, format: uuid }
                    displayName: { type: string }
                    acting: { type: boolean }
              vacant: { type: boolean }
              badges:
                type: array
                items: { type: string, examples: [agreement:EXAMPLE-MUNI-0001, upcoming_change:2026-12-01, funding_ends:2027-03-31, draft] }
              hasChildren: { type: boolean }
        edges:
          type: array
          items:
            type: object
            required: [from, to, kind]
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              kind: { enum: [solid, dotted, acting] }
    Plan:
      type: object
      required: [planId, name, status]
      properties:
        planId: { type: string, format: uuid }
        name: { type: string }
        asOf: { type: string, format: date }
        status: { enum: [open, submitted, approved, discarded] }
        changeSetIds: { type: array, items: { type: string, format: uuid } }
        summary:
          type: object
          properties:
            headcountDelta: { type: integer }
            annualCostDelta: { $ref: '#/components/schemas/Money' }
    Position:
      type: object
      required: [positionId, number, title, status]
      properties:
        positionId: { type: string, format: uuid }
        number: { type: string }
        title: { type: string }
        jobId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        reportsToPositionId: { type: [string, 'null'], format: uuid }
        fteBudget: { type: string }
        fteFilled: { type: string }
        status: { enum: [active, frozen, eliminated] }
        agreementId: { type: [string, 'null'] }
        languageRequirement: { type: [string, 'null'] }
        vacancySince: { type: [string, 'null'], format: date }
    PersonSummary:
      type: object
      required: [personId, displayName]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        primaryEmploymentId: { type: string, format: uuid }
        jobTitle: { type: string }
        orgUnitName: { type: string }
        workEmail: { type: string, format: email }
    Employment:
      type: object
      required: [employmentId, personId, legalEntityId, status, assignments]
      properties:
        employmentId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        employeeNumber: { type: string }
        legalEntityId: { type: string, format: uuid }
        status: { enum: [active, on_leave, suspended, terminated] }
        originalHireDate: { type: string, format: date }
        continuousServiceDate: { type: string, format: date }
        assignments:
          type: array
          items:
            type: object
            properties:
              assignmentId: { type: string, format: uuid }
              positionId: { type: [string, 'null'], format: uuid }
              orgUnitId: { type: string, format: uuid }
              locationId: { type: string, format: uuid }
              managerAssignmentId: { type: [string, 'null'], format: uuid }
              fte: { type: string }
              agreementId: { type: [string, 'null'] }
              isPrimary: { type: boolean }
        derived:
          type: object
          description: Values computed at read time, never stored
          properties:
            managerName: { type: string }
            taxProvince: { type: string }
            esJurisdiction: { type: string }
            holidayCalendar: { type: string }
        upcomingChanges:
          type: array
          items:
            type: object
            properties:
              effectiveDate: { type: string, format: date }
              changeSetId: { type: string, format: uuid }
              summary: { type: string }
    HistoryEntry:
      type: object
      required: [entity, validFrom, recordedAt, changeSetId]
      properties:
        entity: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        recordedAt: { type: string, format: date-time }
        supersededAt: { type: [string, 'null'], format: date-time }
        changeSetId: { type: string, format: uuid }
        actor: { type: string }
        reason: { type: string }
        changes: { type: object, additionalProperties: true }
    PayRunCreate:
      type: object
      required: [type, legalEntityId, population, payDate]
      properties:
        type: { enum: [regular, off_cycle, bonus, retro, final, adjustment, reversal, manual_payment_record, simulation] }
        legalEntityId: { type: string, format: uuid }
        payGroupId: { type: string, format: uuid }
        population:
          type: object
          required: [mode]
          properties:
            mode: { enum: [pay_group, employees, query, change_set] }
            employmentIds: { type: array, items: { type: string, format: uuid } }
            query: { type: object, additionalProperties: true }
            changeSetId: { type: string, format: uuid }
        workPeriod: { $ref: '#/components/schemas/DateRange' }
        payDate: { type: string, format: date }
        include:
          type: object
          properties:
            salaryAndHourly: { type: boolean, default: true }
            approvedTime: { type: boolean, default: true }
            leave: { type: boolean, default: true }
            benefits: { type: boolean, default: true }
            recurringDeductions: { type: boolean, default: true }
            oneTimes: { type: array, items: { type: string, format: uuid } }
        taxMethod: { enum: [auto, periodic, non_periodic], default: auto }
        reason: { type: string }
    PayRun:
      allOf:
        - $ref: '#/components/schemas/PayRunCreate'
        - type: object
          required: [payRunId, number, status, taxYear]
          properties:
            payRunId: { type: string, format: uuid }
            number: { type: integer }
            status: { enum: [draft, inputs_locked, calculating, calculated, reviewed, approved, finalized, paid, cancelled] }
            taxYear: { type: integer }
            ruleEditionId: { type: string, examples: [CA-2026-07-01] }
            inputsKnownAt: { type: [string, 'null'], format: date-time, description: System time every calculation read uses; set at lock_inputs }
            engineVersion: { type: [string, 'null'], description: Git commit of the engine build pinned at lock_inputs }
            bucketCount: { type: [integer, 'null'], minimum: 1, maximum: 256 }
            rulePins:
              type: array
              items: { $ref: '#/components/schemas/RulePin' }
            subjectsInOpenRuns:
              type: array
              description: Warning while in draft; lock_inputs fails until these runs finalize or the subjects are removed
              items:
                type: object
                properties:
                  personId: { type: string, format: uuid }
                  payrollAccountId: { type: string, format: uuid }
                  blockingRunId: { type: string, format: uuid }
            changesSinceLock: { type: integer, description: Committed change sets affecting the work period after inputs_known_at; they become retro after finalization }
            progress:
              type: object
              properties:
                total: { type: integer }
                done: { type: integer }
                exceptions: { type: integer }
            controlTotals:
              type: object
              properties:
                gross: { $ref: '#/components/schemas/Money' }
                net: { $ref: '#/components/schemas/Money' }
                employees: { type: integer }
    RulePin:
      type: object
      required: [family, refId, contentSha256]
      properties:
        family: { enum: [statutory, employment_standards, employer_taxes, quebec_tax, agreement, policy, engine] }
        refId: { type: string, examples: [CA-2026-07-01, 'CUPE-1234-OUTSIDE@3'] }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    AuditProof:
      type: object
      required: [auditId, leafHash, batch, path, batchHash, signature, signingKeyId]
      properties:
        auditId: { type: integer }
        leafHash: { type: string, description: hex }
        leafIndex: { type: integer, description: Position of the row in its batch }
        batch:
          type: object
          description: Batch header exactly as hashed (canonical JSON)
          properties:
            tenant_id: { type: string, format: uuid }
            batch_no: { type: integer }
            first_audit_id: { type: [integer, 'null'] }
            last_audit_id: { type: [integer, 'null'] }
            leaf_count: { type: integer }
            sealed_at: { type: string }
        merkleRoot: { type: string }
        prevBatchHash: { type: string }
        path: { type: array, items: { type: string }, description: RFC 6962 audit path, hex, leaf to root }
        batchHash: { type: string }
        signature: { type: string, description: base64 }
        signingKeyId: { type: string }
        anchorUri: { type: [string, 'null'] }
        anchorVersionId: { type: [string, 'null'] }
    PayResult:
      type: object
      required: [payResultId, employmentId, payDate, taxYear, gross, net]
      properties:
        payResultId: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        payDate: { type: string, format: date }
        taxYear: { type: integer }
        province: { type: string }
        taxMethod: { enum: [periodic, non_periodic, mixed] }
        gross: { $ref: '#/components/schemas/Money' }
        cpp: { $ref: '#/components/schemas/Money' }
        cpp2: { $ref: '#/components/schemas/Money' }
        ei: { $ref: '#/components/schemas/Money' }
        incomeTaxFederal: { $ref: '#/components/schemas/Money' }
        incomeTaxProvincial: { $ref: '#/components/schemas/Money' }
        territorialPayrollTax: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items:
            type: object
            required: [payCode, amount]
            properties:
              payCode: { type: string }
              description: { type: string }
              workPeriod: { $ref: '#/components/schemas/DateRange' }
              hours: { type: [string, 'null'] }
              rate: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
              fiscalYear: { type: integer }
              fiscalPeriod: { type: integer }
              retroOfResultId: { type: [string, 'null'], format: uuid }
    PayExplanation:
      type: object
      required: [payResultId, steps]
      properties:
        payResultId: { type: string, format: uuid }
        ruleEditionId: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string, examples: [regular.A, regular.K1, CPP.exemption_per_period] }
              value: { type: string }
              formulaRef: { type: string, examples: ['T4127 ch.4 Step 2'] }
              plainLanguage: { type: string }
    RetroRequest:
      type: object
      required: [retroRequestId, employmentId, status]
      properties:
        retroRequestId: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        triggerChangeSetId: { type: string, format: uuid }
        originalResultId: { type: string, format: uuid }
        status: { enum: [queued, calculated, approved, paid, no_difference, cancelled] }
        difference:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Money' }
    RuleEdition:
      type: object
      required: [editionId, family, effectiveFrom, effectiveTo, status]
      properties:
        editionId: { type: string }
        family: { enum: [statutory, employer_taxes, employment_standards, quebec_tax] }
        taxYear: { type: integer }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        status: { enum: [draft, tested, active, retired] }
        contentSha256: { type: string }
    Decimal: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', examples: ['54271.75'] }
    Statistic: { type: string, enum: [mean, p10, p25, p50, p75, p90] }
    Element:
      type: string
      enum: [base_salary, hourly_rate, range_min, range_mid, range_max, sti_target_pct, sti_actual, sti_actual_pct, sti_eligible, allowances, total_cash, total_direct]
    Lineage:
      type: object
      required: [source, used]
      properties:
        source: { type: string }
        used: { type: boolean }
        reason: { type: string, enum: [NOT_MATCHED, NO_USABLE_CUT, NO_NOC_CODE, NO_USABLE_GEOGRAPHY, STAT_NOT_PUBLISHED] }
        cut: { type: string }
        geo: { type: string }
        components:
          type: array
          items: { type: object, properties: { code: { type: string }, share: { type: number }, nOrgs: { type: integer }, value: { $ref: '#/components/schemas/Decimal' } } }
        months: { $ref: '#/components/schemas/Decimal' }
        ageingFactor: { $ref: '#/components/schemas/Decimal' }
        geoFactor: { $ref: '#/components/schemas/Decimal' }
        agedTarget: { $ref: '#/components/schemas/Decimal' }
        weight: { type: number }
        effectiveWeightPct: { $ref: '#/components/schemas/Decimal' }

    CompetencyFramework:
      type: object
      required: [code, nameEn, versions]
      properties:
        code: { type: string }
        nameEn: { type: string }
        nameFr: { type: [string, 'null'] }
        versions:
          type: array
          items: { type: object, properties: { label: { type: string }, status: { type: string, enum: [draft, published, retired] }, publishedAt: { type: [string, 'null'], format: date-time } } }
    CompetencyFrameworkVersion:
      type: object
      required: [frameworkCode, label, status, scale, competencies]
      properties:
        frameworkCode: { type: string }
        label: { type: string }
        status: { type: string, enum: [draft, published, retired] }
        scale:
          type: array
          items: { type: object, properties: { level: { type: integer }, code: { type: string }, name: { type: string }, descriptor: { type: string } } }
        domains: { type: array, items: { type: object, properties: { code: { type: string }, name: { type: string } } } }
        competencies:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              domain: { type: string }
              name: { type: string }
              definition: { type: string }
              indicatorsStatus: { type: string, enum: [as_provided, proposed, reviewed] }
              levels:
                type: array
                items: { type: object, properties: { level: { type: integer }, indicators: { type: array, items: { type: string } } } }
    CompetencyTarget:
      type: object
      required: [frameworkCode, competencyCode, requiredLevel, criticality, from]
      properties:
        frameworkCode: { type: string }
        competencyCode: { type: string }
        requiredLevel: { type: integer }
        entryLevel: { type: [integer, 'null'] }
        criticality: { type: string, enum: [critical, important, useful] }
        status: { type: string, enum: [proposed, active] }
        source: { type: string, enum: [career_level_default, job, position, manual, assistant] }
        from: { type: string, enum: [job, position] }
        reason: { type: [string, 'null'] }
        validFrom: { type: string, format: date }
    CompetencyAssessmentInput:
      type: object
      required: [frameworkCode, frameworkVersion, competencyCode, assessedLevel, source, context, assessedOn]
      properties:
        frameworkCode: { type: string }
        frameworkVersion: { type: string }
        competencyCode: { type: string }
        assessedLevel: { type: integer, minimum: 1 }
        source: { type: string, enum: [self, manager, peer_360, assessment, evidence, calibrated] }
        context: { type: string, enum: [performance_review, development, promotion, succession, selection, probation, other] }
        assessedOn: { type: string, format: date }
        reviewId: { type: string, format: uuid }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
        comment: { type: string }
        final: { type: boolean, default: false }
        supersedesAssessmentId: { type: string, format: uuid }
    CompetencyAssessment:
      allOf:
        - $ref: '#/components/schemas/CompetencyAssessmentInput'
        - type: object
          properties:
            assessmentId: { type: string, format: uuid }
            status: { type: string, enum: [draft, final, superseded] }
            finalizedAt: { type: [string, 'null'], format: date-time }
    CompetencyGap:
      type: object
      required: [competencyCode, requiredLevel]
      properties:
        frameworkCode: { type: string }
        competencyCode: { type: string }
        requiredLevel: { type: integer }
        entryLevel: { type: [integer, 'null'] }
        criticality: { type: string }
        targetFrom: { type: string, enum: [job, position] }
        assessedLevel: { type: [integer, 'null'] }
        assessedOn: { type: [string, 'null'], format: date }
        assessmentSource: { type: [string, 'null'] }
        selfLevel: { type: [integer, 'null'] }
        gap: { type: [integer, 'null'] }

    JobEvaluationPlan:
      type: object
      required: [code, method, purposes, versions]
      properties:
        code: { type: string }
        name: { type: string }
        method: { type: string, enum: [point_factor, classification, ranking, market_slotting] }
        purposes: { type: array, items: { type: string, enum: [grading, pay_equity] } }
        versions:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              status: { type: string, enum: [draft, published, retired] }
              maxPoints: { type: integer }
              gradeBands: { type: array, items: { type: object, properties: { grade: { type: string }, min: { type: integer }, max: { type: integer } } } }
              factors:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    group: { type: string, enum: [skill, effort, responsibility, working_conditions] }
                    name: { type: string }
                    maxPoints: { type: integer }
                    degrees: { type: array, items: { type: object, properties: { degree: { type: integer }, points: { type: integer }, descriptor: { type: string } } } }
    FactorRating:
      type: object
      required: [factorCode, degree, points, rationale]
      properties:
        factorCode: { type: string }
        degree: { type: integer }
        points: { type: integer }
        rationale: { type: string }
        suggested: { type: [array, 'null'], items: { type: integer }, minItems: 2, maxItems: 2 }
        outsideReason: { type: [string, 'null'] }
        evidence: { type: object, additionalProperties: true }
    JobEvaluation:
      type: object
      required: [evaluationId, jobId, planCode, planVersion, status]
      properties:
        evaluationId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        positionId: { type: [string, 'null'], format: uuid }
        planCode: { type: string }
        planVersion: { type: string }
        status: { type: string, enum: [draft, in_review, approved, superseded, withdrawn] }
        effectiveFrom: { type: string, format: date }
        totalPoints: { type: [integer, 'null'] }
        grade: { type: [string, 'null'] }
        ratings: { type: array, items: { $ref: '#/components/schemas/FactorRating' } }
        evidence:
          type: object
          description: NOC code and TEER, career level, competency targets, requirements and reports shown beside the factors
          additionalProperties: true
        reviewFlag: { type: [string, 'null'] }
        supersedesEvaluationId: { type: [string, 'null'], format: uuid }

    SurveyInput:
      type: object
      required: [code, name, publisher, derivedResultsRestricted]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,30}$' }
        name: { type: string }
        publisher: { type: string }
        licence:
          type: object
          properties:
            licensee: { type: string }
            allowedUses: { type: array, items: { type: string, enum: [internal_pricing, combine_with_other_sources, aggregate_reporting] } }
            employeesMaySee: { type: boolean, default: false }
            expiresOn: { type: string, format: date }
            deleteOnExpiry: { type: boolean, default: false }
        derivedResultsRestricted: { type: boolean, description: What the licence says about results derived from this survey; stated for every survey (docs/22 §3.2) }
        dutiesMatchThreshold: { type: number, minimum: 0, maximum: 100, description: When not given, the organization's setting surveys.duties_match_threshold }
        participates: { type: boolean, default: false }
    Survey:
      allOf:
        - $ref: '#/components/schemas/SurveyInput'
        - type: object
          properties:
            surveyId: { type: string, format: uuid }
            schemeCode: { type: string }
            accessRole: { type: string, examples: ['survey_data:SVY_A'] }
            callerHasAccess: { type: boolean }
            status: { type: string, enum: [active, expired, retired] }
            editions: { type: array, items: { $ref: '#/components/schemas/SurveyEdition' } }
    SurveyEditionInput:
      type: object
      required: [label, effectiveDate]
      properties:
        label: { type: string, examples: ['2025'] }
        effectiveDate: { type: string, format: date }
        publishedOn: { type: string, format: date }
        currency: { type: string, description: When not given, the organization's setting money.currency }
        participants: { type: integer }
        hoursBasis: { $ref: '#/components/schemas/Decimal' }
        masking: { type: object, additionalProperties: true, examples: [ { p50: { nOrgs: 4 }, p25: { nOrgs: 5 } } ] }
        weightings: { type: array, items: { type: string, enum: [organization, incumbent, single] } }
    SurveyEdition:
      allOf:
        - $ref: '#/components/schemas/SurveyEditionInput'
        - type: object
          properties:
            editionId: { type: string, format: uuid }
            status: { type: string, enum: [loading, published, retired] }
            files: { type: array, items: { type: object, properties: { name: { type: string }, sha256: { type: string }, profile: { type: string } } } }
    ImportReport:
      type: object
      required: [profile, dryRun, rows, errors, warnings]
      properties:
        profile: { type: string }
        dryRun: { type: boolean }
        columnMap: { type: object, additionalProperties: { type: string } }
        rows: { type: integer }
        loaded: { type: integer }
        sha256: { type: string }
        errors:
          type: array
          items: { type: object, properties: { code: { type: string }, row: { type: integer }, column: { type: string }, params: { type: object, additionalProperties: true } } }
        warnings:
          type: array
          items: { type: object, properties: { code: { type: string }, row: { type: integer }, column: { type: string }, params: { type: object, additionalProperties: true } } }
    MarketDataRow:
      type: object
      required: [jobCode, cut, weighting, element, nOrgs]
      properties:
        jobCode: { type: string }
        cut: { type: string }
        weighting: { type: string, enum: [organization, incumbent, single] }
        element: { $ref: '#/components/schemas/Element' }
        nOrgs: { type: integer }
        nIncumbents: { type: [integer, 'null'] }
        mean: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        p10: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        p25: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        p50: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        p75: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        p90: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        maskedFields: { type: array, items: { $ref: '#/components/schemas/Statistic' } }

    MarketDefinition:
      type: object
      required: [code, name, statistic, sources]
      properties:
        code: { type: string }
        name: { type: string }
        appliesTo: { type: object, additionalProperties: true }
        isDefault: { type: boolean }
        statistic: { $ref: '#/components/schemas/Statistic' }
        statistics: { type: array, items: { $ref: '#/components/schemas/Statistic' } }
        adjustPct: { $ref: '#/components/schemas/Decimal' }
        minimum: { type: object, properties: { nOrgs: { type: integer }, nIncumbents: { type: integer } } }
        minSources: { type: integer, minimum: 1, description: When not given, the organization's setting market.default_min_sources }
        ageing:
          type: object
          required: [method]
          properties:
            method: { type: string, enum: [none, simple, compound] }
            annualRate: { $ref: '#/components/schemas/Decimal' }
        sources:
          type: array
          items:
            type: object
            required: [kind, weight]
            properties:
              kind: { type: string, enum: [survey, public_wage] }
              editionId: { type: string, format: uuid }
              publicEditionId: { type: string }
              weighting: { type: string, enum: [organization, incumbent, single] }
              element: { $ref: '#/components/schemas/Element' }
              cutChain: { type: array, items: { type: string } }
              geoChain: { type: array, items: { type: string } }
              hoursBasis: { $ref: '#/components/schemas/Decimal' }
              weight: { type: number, exclusiveMinimum: 0 }
              geoDifferentialPct: { $ref: '#/components/schemas/Decimal' }
    PricingRun:
      type: object
      required: [runId, definitionCode, asOf, status]
      properties:
        runId: { type: string, format: uuid }
        definitionCode: { type: string }
        asOf: { type: string, format: date }
        status: { type: string, enum: [draft, approved, superseded] }
        stale: { type: boolean }
        progress: { type: object, properties: { done: { type: integer }, total: { type: integer } } }
        results:
          type: array
          items:
            type: object
            required: [jobId, status]
            properties:
              jobId: { type: string, format: uuid }
              status: { type: string, enum: [priced, insufficient_data] }
              market: { type: object, additionalProperties: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] } }
              target: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
              lineage: { type: array, items: { $ref: '#/components/schemas/Lineage' } }
    PayStructureVersion:
      type: object
      required: [versionId, structureCode, label, status, grades]
      properties:
        versionId: { type: string, format: uuid }
        structureCode: { type: string }
        label: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        status: { type: string, enum: [draft, approved, superseded] }
        marketLine:
          type: [object, 'null']
          properties:
            a: { $ref: '#/components/schemas/Decimal' }
            b: { $ref: '#/components/schemas/Decimal' }
            r2: { $ref: '#/components/schemas/Decimal' }
            progressionPer100Points: { $ref: '#/components/schemas/Decimal' }
            residuals:
              type: array
              items: { type: object, properties: { jobId: { type: string, format: uuid }, points: { type: integer }, value: { $ref: '#/components/schemas/Decimal' }, predicted: { $ref: '#/components/schemas/Decimal' }, residualPct: { $ref: '#/components/schemas/Decimal' }, outlier: { type: boolean } } }
        grades:
          type: array
          items:
            type: object
            properties:
              grade: { type: string }
              pointsMin: { type: [integer, 'null'] }
              pointsMax: { type: [integer, 'null'] }
              minimum: { $ref: '#/components/schemas/Decimal' }
              midpoint: { $ref: '#/components/schemas/Decimal' }
              maximum: { $ref: '#/components/schemas/Decimal' }
              spreadPct: { $ref: '#/components/schemas/Decimal' }
              progressionPct: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
              overlapWithLowerPct: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        modelling:
          type: object
          properties:
            belowMinimum: { type: integer }
            aboveMaximum: { type: integer }
            costToMinimum: { $ref: '#/components/schemas/Decimal' }

    PracticeComparison:
      type: object
      required: [practiceCode, result]
      properties:
        practiceCode: { type: string }
        category: { type: string }
        name: { type: string }
        unit: { type: [string, 'null'] }
        own: { description: The population's value in the practice's unit }
        market:
          type: [object, 'null']
          properties:
            nOrgs: { type: integer }
            prevalencePct: { $ref: '#/components/schemas/Decimal' }
            p25: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
            p50: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
            p75: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
            mode: { type: [string, 'null'] }
        result: { type: string, enum: [richer, at_market, leaner, not_compared, no_market_data] }

    SurveySubmission:
      type: object
      required: [submissionId, surveyCode, editionLabel, asOf, status]
      properties:
        submissionId: { type: string, format: uuid }
        surveyCode: { type: string }
        editionLabel: { type: string }
        asOf: { type: string, format: date }
        status: { type: string, enum: [draft, in_review, approved, exported, withdrawn] }
        orgProfile: { type: object, additionalProperties: true }
        includedFields: { type: array, items: { type: string } }
        rowCount: { type: [integer, 'null'] }
        fileSha256: { type: [string, 'null'] }
        rows:
          type: array
          items:
            type: object
            properties:
              pseudonym: { type: [string, 'null'] }
              vacant: { type: boolean }
              jobCode: { type: string }
              matchQuality: { type: string, enum: [exact, close, partial] }
              fte: { $ref: '#/components/schemas/Decimal' }
              annualBase: { $ref: '#/components/schemas/Decimal' }
              hourlyRate: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
              stiEligible: { type: [boolean, 'null'] }
              stiTargetPct: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
              stiPaid: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
              locationCode: { type: [string, 'null'] }
              extra: { type: object, additionalProperties: true }

    PublicWage:
      type: object
      required: [editionId, nocCode, geoCode, basis]
      properties:
        editionId: { type: string }
        referencePeriod: { type: string }
        nocCode: { type: string }
        geoCode: { type: string }
        geoLevel: { type: string, enum: [national, province, region] }
        geoName: { type: string }
        basis: { type: string, enum: [hourly, annual] }
        low: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        median: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        high: { oneOf: [ { $ref: '#/components/schemas/Decimal' }, { type: 'null' } ] }
        estimation: { type: string, enum: [direct, small_area, other_geography, other_source] }
        dataSource: { type: [string, 'null'] }
