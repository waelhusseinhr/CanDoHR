# CanDo domain events (AsyncAPI 3.0 style). Delivered in-process from the outbox and to customer webhooks.
asyncapi: 3.0.0
info:
  title: CanDo HRIS events
  version: 1.0.0-draft
  description: |
    Every event uses the same envelope. Sensitive values (SIN, banking, pay amounts, health, self-identification)
    are never included; subscribers call the API with their own permissions for details.
    Events for one subject are delivered in commit order. Subscribers must be idempotent on eventId.
channels:
  domainEvents:
    address: cando.events
    messages:
      personCreated: { $ref: '#/components/messages/personCreated' }
      personUpdated: { $ref: '#/components/messages/personUpdated' }
      employmentHired: { $ref: '#/components/messages/employmentHired' }
      employmentStatusChanged: { $ref: '#/components/messages/employmentStatusChanged' }
      employmentTerminated: { $ref: '#/components/messages/employmentTerminated' }
      assignmentChanged: { $ref: '#/components/messages/assignmentChanged' }
      positionChanged: { $ref: '#/components/messages/positionChanged' }
      positionVacated: { $ref: '#/components/messages/positionVacated' }
      orgChanged: { $ref: '#/components/messages/orgChanged' }
      rateChanged: { $ref: '#/components/messages/rateChanged' }
      agreementVersionActivated: { $ref: '#/components/messages/agreementVersionActivated' }
      timeApproved: { $ref: '#/components/messages/timeApproved' }
      timeCorrected: { $ref: '#/components/messages/timeCorrected' }
      leaveApproved: { $ref: '#/components/messages/leaveApproved' }
      benefitEnrolled: { $ref: '#/components/messages/benefitEnrolled' }
      payrunFinalized: { $ref: '#/components/messages/payrunFinalized' }
      paymentReleased: { $ref: '#/components/messages/paymentReleased' }
      retroRequested: { $ref: '#/components/messages/retroRequested' }
      ruleEditionLoaded: { $ref: '#/components/messages/ruleEditionLoaded' }
      cautionAcknowledged: { $ref: '#/components/messages/cautionAcknowledged' }
      requisitionApproved: { $ref: '#/components/messages/requisitionApproved' }
      postingPublished: { $ref: '#/components/messages/postingPublished' }
      applicationDecided: { $ref: '#/components/messages/applicationDecided' }
      offerApproved: { $ref: '#/components/messages/offerApproved' }
      offerSent: { $ref: '#/components/messages/offerSent' }
      offerAccepted: { $ref: '#/components/messages/offerAccepted' }
      offerContractSigned: { $ref: '#/components/messages/offerContractSigned' }
      offerExpired: { $ref: '#/components/messages/offerExpired' }
      onboardingTaskOverdue: { $ref: '#/components/messages/onboardingTaskOverdue' }
      onboardingLegalDueSoon: { $ref: '#/components/messages/onboardingLegalDueSoon' }
      probationReminderDue: { $ref: '#/components/messages/probationReminderDue' }
      probationExtended: { $ref: '#/components/messages/probationExtended' }
      probationLapsedPassed: { $ref: '#/components/messages/probationLapsedPassed' }
      probationLeaveCautionShown: { $ref: '#/components/messages/probationLeaveCautionShown' }
      statusConversionFlagged: { $ref: '#/components/messages/statusConversionFlagged' }
operations:
  publishDomainEvents:
    action: send
    channel: { $ref: '#/channels/domainEvents' }
components:
  schemas:
    Envelope:
      type: object
      required: [eventId, type, version, tenantId, occurredAt, subject, changeSetId]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string }
        version: { type: integer }
        tenantId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        effectiveDate: { type: string, format: date }
        changeSetId: { type: string, format: uuid }
        subject:
          type: object
          required: [type, id]
          properties:
            type: { type: string }
            id: { type: string }
            employmentId: { type: string, format: uuid }
            personId: { type: string, format: uuid }
        changes:
          description: 'Changed field names with from and to values for non-sensitive fields; sensitive fields appear only as {"changed": true}'
          type: object
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}
              changed: { type: boolean }
        derived:
          description: Derived values that changed as a consequence (taxProvince, esJurisdiction, holidayCalendar, managerAssignmentId)
          type: object
          additionalProperties: true
        actor:
          type: object
          properties:
            type: { enum: [user, system, assistant, integration] }
            id: { type: string }
  messages:
    personCreated: { name: person.created, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Subscribers: directory, IdP sync, analytics' }
    personUpdated: { name: person.updated, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Legal name changes also flag the current-year T4 name' }
    employmentHired: { name: employment.hired, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Payroll setup, benefits eligibility, onboarding plan, IdP provisioning, schedule' }
    employmentStatusChanged: { name: employment.status_changed, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Probation, conversion, leave start/end; ROE trigger on interruption of earnings' }
    employmentTerminated: { name: employment.terminated, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Final pay, ROE, coverage end, deprovisioning at the configured time' }
    assignmentChanged: { name: assignment.changed, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Payroll inputs, time approver and rules, benefits class, org chart push' }
    positionChanged: { name: position.changed, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Org chart push, workforce plan' }
    positionVacated: { name: position.vacated, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Backfill prompt, requisition suggestion' }
    orgChanged: { name: org.changed, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Units moved or reporting lines changed; chart refresh and approval rerouting' }
    rateChanged: { name: rate.changed, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Amounts are not in the event; payroll reads the rate' }
    agreementVersionActivated: { name: agreement.version_activated, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Rules cache invalidation; retro requests when retro_from is set' }
    timeApproved: { name: time.approved, payload: { $ref: '#/components/schemas/Envelope' } }
    timeCorrected: { name: time.corrected, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Locked-period correction; payroll creates a retro request' }
    leaveApproved: { name: leave.approved, payload: { $ref: '#/components/schemas/Envelope' } }
    benefitEnrolled: { name: benefit.enrolled, payload: { $ref: '#/components/schemas/Envelope' } }
    payrunFinalized: { name: payrun.finalized, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'GL export, remittances, statements, analytics' }
    paymentReleased: { name: payment.released, payload: { $ref: '#/components/schemas/Envelope' } }
    retroRequested: { name: retro.requested, payload: { $ref: '#/components/schemas/Envelope' } }
    ruleEditionLoaded: { name: rule_edition.loaded, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Compliance dashboard; payroll pre-run checks' }
    cautionAcknowledged: { name: caution.acknowledged, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    requisitionApproved: { name: requisition.approved, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    postingPublished: { name: posting.published, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    applicationDecided: { name: application.decided, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    offerApproved: { name: offer.approved, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    offerSent: { name: offer.sent, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    offerAccepted: { name: offer.accepted, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    offerContractSigned: { name: offer.contract_signed, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    offerExpired: { name: offer.expired, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    onboardingTaskOverdue: { name: onboarding.task_overdue, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    onboardingLegalDueSoon: { name: onboarding.legal_due_soon, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    probationReminderDue: { name: probation.reminder_due, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    probationExtended: { name: probation.extended, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    probationLapsedPassed: { name: probation.lapsed_passed, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    probationLeaveCautionShown: { name: probation.leave_caution_shown, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
    statusConversionFlagged: { name: status_conversion.flagged, payload: { $ref: '#/components/schemas/Envelope' }, summary: 'Identifiers only' }
